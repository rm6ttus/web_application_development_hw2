
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Post</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="top-bar">
        <nav class="nav-links">
            <a href="index.html" class="nav-item">Home</a>
        </nav>
        <div class="user-avatar">
            <img src="images/user_avatar.png" alt="User Profile">
        </div>
    </header>

    <main class="app-container">
        <article class="post-card">
            <h1>Create a post</h1>

            <form action="index.html" method="GET" class="post-form">
                <div class="form-group">
                    <label for="post-body">Post body</label>
                    <textarea id="post-body" name="body" placeholder="textarea" required></textarea>
                </div>

                <div class="form-group">
                    <label for="file-upload">Select file</label>
                    <input type="file" id="file-upload" name="file">
                </div>

                <button type="submit" class="create-post-btn">Create post</button>
            </form>
    </article>
    </main>
</body>
</html>
